# UTOP — git clone 후 `docker compose up -d` 하나로 전부 뜬다.
#
#   접속:  http://localhost:8080
#
# 리눅스·윈도우(Docker Desktop) 동일하게 동작한다.
# 데이터는 전부 named volume 에 남는다 — 소스 트리에는 아무것도 쌓이지 않는다.
# 이것이 "소스와 데이터 분리"의 실체다.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utop}
      POSTGRES_USER: ${POSTGRES_USER:-utop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 최초 기동 시 1회만 실행된다 (볼륨이 비어 있을 때).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-utop} -d ${POSTGRES_DB:-utop}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-utop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-utop}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-}
      DIFY_FILE_VAR: ${DIFY_FILE_VAR:-}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - app-data:/app/data
    # 백엔드를 이 PC 안에서만 볼 수 있게 연다.
    #  - 프론트 개발 서버(web/ 에서 npm run dev, 5173)가 /api 를 여기로 넘긴다.
    #  - API 문서(/docs)나 curl 로 직접 찔러볼 때도 쓴다.
    # 127.0.0.1 로 묶는 이유: 인증이 붙었지만 백엔드를 굳이 사내망에 직접
    # 노출할 이유가 없다. 사용자는 web(9000) 을 통해서만 들어온다.
    # 이 바인딩을 넓히지 말 것 — /docs 까지 같이 열린다.
    ports:
      - '127.0.0.1:${API_PORT:-8000}:8000'

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-9000}:80'

volumes:
  db-data:
  app-data:
