# UTOP — git clone 후 `docker compose up -d` 하나로 전부 뜬다.
#
#   접속:  http://localhost:8080
#
# 리눅스·윈도우(Docker Desktop) 동일하게 동작한다.
# 데이터는 전부 named volume 에 남는다 — 소스 트리에는 아무것도 쌓이지 않는다.
# 이것이 "소스와 데이터 분리"의 실체다.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utop}
      POSTGRES_USER: ${POSTGRES_USER:-utop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 최초 기동 시 1회만 실행된다 (볼륨이 비어 있을 때).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-utop} -d ${POSTGRES_DB:-utop}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-utop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-utop}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-}
      DIFY_FILE_VAR: ${DIFY_FILE_VAR:-}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - app-data:/app/data
    # 백엔드는 호스트에 포트를 열지 않는다. 사용자는 web(9000) 으로만 들어오고,
    # nginx 가 도커 내부망으로 http://api:8000 에 붙으므로 이것으로 충분하다.
    # 열어두면 /docs 와 모든 API 가 이 PC 에서 그대로 노출된다.
    #
    # 직접 찔러봐야 할 때만 아래를 잠깐 켠다(디버깅용). 켠 뒤에는 다시 끌 것.
    #   ports:
    #     - '127.0.0.1:${API_PORT:-8000}:8000'
    #
    # 컨테이너 안에서는 포트를 열지 않아도 언제든 확인할 수 있다:
    #   docker compose exec api curl -s localhost:8000/api/health

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-9000}:80'

volumes:
  db-data:
  app-data:
