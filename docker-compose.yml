# UTOP — git clone 후 `docker compose up -d` 하나로 전부 뜬다.
#
#   접속:  http://localhost:8080
#
# 리눅스·윈도우(Docker Desktop) 동일하게 동작한다.
# 데이터는 전부 named volume 에 남는다 — 소스 트리에는 아무것도 쌓이지 않는다.
# 이것이 "소스와 데이터 분리"의 실체다.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utop}
      POSTGRES_USER: ${POSTGRES_USER:-utop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
      # 최초 기동 시 1회만 실행된다 (볼륨이 비어 있을 때).
      - ./db/schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-utop} -d ${POSTGRES_DB:-utop}']
      interval: 5s
      timeout: 5s
      retries: 20

  # DB 를 웹으로 보는 창 — http://<서버>:8081 (시스템: PostgreSQL,
  # 서버: db, 사용자/암호: .env 의 것, 데이터베이스: utop)
  adminer:
    image: adminer:latest
    restart: unless-stopped
    depends_on:
      - db
    ports:
      - '8081:8080'

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      args:
        # 도움말 위에 「판」 으로 선다. start.sh 가 채운다 — 없으면 빈 값.
        GIT_SHA: ${GIT_SHA:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-utop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-utop}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-}
      DIFY_FILE_VAR: ${DIFY_FILE_VAR:-}
      # 실행기가 자기를 밝히는 열쇠. 없으면 실행 대기줄이 아예 안 열린다.
      RUNNER_KEY: ${RUNNER_KEY:-}
      # N2X 중계. .env 에 넣어도 여기서 넘기지 않으면 컨테이너 안까지 안 온다.
      # 있으면 N2X 명령이 그 윈도우 중계로 나간다. 없으면 이 기계에서
      # 직접(리눅스라 실패) — 그래서 반드시 넘겨야 한다.
      N2X_RELAY_URL: ${N2X_RELAY_URL:-}
      N2X_RELAY_KEY: ${N2X_RELAY_KEY:-}
      TZ: ${TZ:-Asia/Seoul}
      # 라이선스 강제 — 빈 값(기본): 한 번이라도 등록된 서버만 만료 시 보기 전용 · 1: 미등록도 보기 전용 · 0: 끔
      UTOP_LICENSE_ENFORCE: ${UTOP_LICENSE_ENFORCE:-}
    volumes:
      - app-data:/app/data
      # 라이선스 장비 확인 — 컨테이너는 가상 NIC·가상 호스트명만 보므로 호스트의 /sys 와
      # 호스트명을 읽기 전용으로 붙인다(licensing.host_machine). host 네트워크 모드는 필요 없다.
      - /sys:/hostsys:ro
      - /etc/hostname:/etc/host_hostname:ro
    # 백엔드는 호스트에 포트를 열지 않는다. 사용자는 web(9000) 으로만 들어오고,
    # nginx 가 도커 내부망으로 http://api:8000 에 붙으므로 이것으로 충분하다.
    # 열어두면 /docs 와 모든 API 가 이 PC 에서 그대로 노출된다.
    #
    # 직접 찔러봐야 할 때만 아래를 잠깐 켠다(디버깅용). 켠 뒤에는 다시 끌 것.
    #   ports:
    #     - '127.0.0.1:${API_PORT:-8000}:8000'
    #
    # 컨테이너 안에서는 포트를 열지 않아도 언제든 확인할 수 있다:
    #   docker compose exec api curl -s localhost:8000/api/health

  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-9000}:80'

  # 사이클 실행기.
  #
  # 전에는 브라우저가 실행을 붙들고 있었다. 64건을 걸어 놓고 탭을 닫으면
  # 거기서 멈췄고, 자리를 뜰 수가 없었다.
  #
  # 화면과 **같은** runner.ts·judge.ts 를 Node 로 묶어 돈다. 판정기가 두
  # 벌이면 한 화면에서 적합인 것이 다른 화면에서 부적합이 된다.
  #
  # 장비에는 직접 안 붙는다 — API 를 통해 붙으므로 여기에는 ssh 도
  # telnet 도 필요 없다. 실행 서버를 253 에 따로 두려면 이 서비스만
  # 거기서 띄우고 API_BASE 를 213 으로 향하게 하면 된다.
  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    environment:
      API_BASE: ${RUNNER_API_BASE:-http://api:8000}
      RUNNER_KEY: ${RUNNER_KEY:-}
      RUNNER_NAME: ${RUNNER_NAME:-runner}
      # 동시에 몇 건까지 도나 — 장비가 다른 플랜은 같이 돈다
      RUNNER_JOBS: ${RUNNER_JOBS:-4}
      TZ: ${TZ:-Asia/Seoul}

volumes:
  db-data:
  app-data:
