# UTOP — 공용 서버용. 소스도 빌드도 필요 없다.
#
#   docker compose -f docker-compose.server.yml pull
#   docker compose -f docker-compose.server.yml up -d
#
# 이미지는 깃허브가 자동으로 만들어 올린다(.github/workflows/publish.yml).
# 서버는 그것을 받아 띄우기만 한다 — git·node·python 이 필요 없다.
#
# 갱신도 위 두 줄이 전부다. 자료는 named volume 에 있어 지워지지 않는다.

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-utop}
      POSTGRES_USER: ${POSTGRES_USER:-utop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD 를 .env 에 설정하세요}
    volumes:
      - db-data:/var/lib/postgresql/data
    # schema.sql 을 마운트하지 않는다. 소스가 없는 서버라 파일이 없고,
    # 어차피 백엔드가 기동할 때마다 적용한다(db.py 의 apply_schema).
    # schema.sql 은 api 이미지 안에 들어 있다.
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-utop} -d ${POSTGRES_DB:-utop}']
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    image: ghcr.io/kyuchong/utop-api:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-utop}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-utop}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DIFY_BASE_URL: ${DIFY_BASE_URL:-}
      DIFY_FILE_VAR: ${DIFY_FILE_VAR:-}
      TZ: ${TZ:-Asia/Seoul}
    volumes:
      - app-data:/app/data
    # 백엔드는 호스트에 포트를 열지 않는다. web(9000) 으로만 들어오고
    # nginx 가 도커 내부망으로 api:8000 에 붙는다.

  web:
    image: ghcr.io/kyuchong/utop-web:latest
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - '${WEB_PORT:-9000}:80'

volumes:
  db-data:
  app-data:
