# main 에 올릴 때마다 도커 이미지를 만들어 GHCR 에 올린다.
#
# 왜 필요한가: 서버에서 소스를 받아 빌드하면 git·빌드 도구가 필요하고,
# 충돌·권한 문제가 계속 생긴다. 이미지를 미리 만들어 두면 서버는
# `docker compose pull && docker compose up -d` 두 줄이면 끝난다.
name: 도커 이미지 발행

on:
  push:
    branches: [main]
  # 손으로도 돌릴 수 있게 (Actions 탭 → Run workflow)
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GHCR 에 올리려면 이 권한이 있어야 한다
      packages: write

    strategy:
      # 하나가 실패해도 나머지는 끝까지 만든다 — api 만 고쳤는데 web 때문에
      # 둘 다 안 올라가면 원인을 찾기 어렵다.
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            dockerfile: backend/Dockerfile
          - name: web
            context: ./web
            dockerfile: ./web/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # 워크플로에 자동으로 주어지는 토큰. 따로 만들 필요 없다.
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 이미지 이름 정하기
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.name }}
          # latest 와 커밋 해시 둘 다 붙인다. 문제가 생겼을 때 해시로
          # 특정 시점으로 되돌릴 수 있어야 한다.
          tags: |
            type=raw,value=latest
            type=sha,format=short

      - name: 빌드하고 올리기
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 다음 빌드를 빠르게 — 바뀐 층만 다시 만든다
          cache-from: type=gha
          cache-to: type=gha,mode=max
