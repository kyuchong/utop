server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드·리포트 첨부가 큰 편이라 넉넉히 잡는다.
    client_max_body_size 100m;

    # 눌러서 보낸다.
    #
    # 목록 응답이 수백 KB 다(시험·장비·요구사항). 새로고침마다 그것을 날것
    # 그대로 보내고 있었다 — 줄이는 값이 크고, 미는 품은 nginx 쪽이라 싸다.
    # 스트리밍(SSE)은 저절로 빠진다 — text/event-stream 은 아래 목록에 없다.
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types application/json application/javascript text/javascript text/css
               text/plain image/svg+xml application/xml;

    # SPA — 알 수 없는 경로는 index.html 로 돌린다.
    #
    # index.html 은 절대 캐시하지 않는다. 자산 이름에는 해시가 붙어 매번
    # 바뀌지만, 그 이름을 가리키는 것이 index.html 이다. 이 파일이 캐시에
    # 걸리면 새로 올린 화면이 브라우저에 영영 안 닿는다 — 배포는 됐는데
    # 「아직 그대로예요」 가 반복되던 것이 이것이다. Cache-Control 을 안
    # 주면 브라우저가 Last-Modified 로 제멋대로 유효기간을 잡는다.
    location / {
        try_files $uri $uri/ /index.html;
        # **no-store**: 브라우저가 아예 쥐고 있지 못하게 한다.
        #
        # no-cache 는 「쓰기 전에 물어보라」 인데, 물어보지 않고 쓰는 브라우저가
        # 있었다 — 새 판을 올려도 옛 화면이 계속 떴다(지적: 반영이 안 됐다).
        # ETag·Last-Modified 도 걷는다: 그것이 남아 있으면 304 로 옛것을 쓴다.
        # index.html 은 2KB 다. 매번 받아도 값이 없다.
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        etag off;
        if_modified_since off;
    }

    # 해시가 붙은 정적 자산은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 시험 실행·AI 스트리밍은 오래 걸린다. 기본 60초로는 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;   # SSE 스트리밍이 버퍼에 갇히지 않도록
    }

    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
