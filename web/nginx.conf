server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 업로드·리포트 첨부가 큰 편이라 넉넉히 잡는다.
    client_max_body_size 100m;

    # SPA — 알 수 없는 경로는 index.html 로 돌린다.
    #
    # index.html 은 절대 캐시하지 않는다. 자산 이름에는 해시가 붙어 매번
    # 바뀌지만, 그 이름을 가리키는 것이 index.html 이다. 이 파일이 캐시에
    # 걸리면 새로 올린 화면이 브라우저에 영영 안 닿는다 — 배포는 됐는데
    # 「아직 그대로예요」 가 반복되던 것이 이것이다. Cache-Control 을 안
    # 주면 브라우저가 Last-Modified 로 제멋대로 유효기간을 잡는다.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # 해시가 붙은 정적 자산은 오래 캐시해도 안전하다.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 시험 실행·AI 스트리밍은 오래 걸린다. 기본 60초로는 끊긴다.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;   # SSE 스트리밍이 버퍼에 갇히지 않도록
    }

    location /ws {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}
