<!doctype html>
<!-- translate=no: 크롬 자동 번역이 DOM 글자를 바꿔치기해 목록 이름이 "..." 로
     보이는 사고가 있었다(2026-08-16). 시험 용어는 번역 대상이 아니다. -->
<html lang="ko" translate="no">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="google" content="notranslate" />
    <title>UTOP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- **지금 화면이 어느 판인가**(지적: 받았는데 전혀 변한 게 없다).
         Vite 가 번들 이름에 붙이는 해시를 그대로 읽어 둔다 — 빌드가 바뀌면
         파일 이름이 바뀌므로, 이 여섯 글자가 그대로면 옛 것을 보고 있는
         것이다(브라우저 캐시 포함). 왼쪽 메뉴 맨 아래에 보인다. -->
    <script>
      (function () {
        try {
          var s = document.querySelector('script[type=module][src*="index-"]')
          var m = s && /index-([A-Za-z0-9_-]{6,})\./.exec(s.getAttribute('src') || '')
          document.documentElement.dataset.build = m ? m[1].slice(0, 6) : 'dev'
        } catch (e) {
          document.documentElement.dataset.build = '—'
        }
      })()
    </script>
  </body>
</html>
