<title>Test AI 시험 콘솔</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --bg:#f2f5f9; --panel:#ffffff; --panel2:#eef2f7; --panel3:#f8fafc;
  --ink:#1e2a38; --sub:#5c6d80; --line:#d7dfe9; --line2:#c3cedb;
  --accent:#2f6bde; --accent-ink:#ffffff; --accent-soft:#e9f0fc; --accent-line:#b9cdf2;
  --ok:#177a48; --ok-soft:#e2f3e9; --busy:#a06a0a; --busy-soft:#faf0da;
  --bad:#bf3f2e; --bad-soft:#fae8e5; --off:#8494a6; --off-soft:#eef2f6;
  --term-bg:#0f1721; --term-ink:#c8d6e5; --term-dim:#5d7186; --term-ok:#54c98a; --term-bad:#ef8b7c;
  --shadow:0 10px 30px rgba(30,42,56,.10);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0f1520; --panel:#182130; --panel2:#0c121b; --panel3:#131b28;
    --ink:#e6edf5; --sub:#96a5b8; --line:#2a3648; --line2:#3a4a60;
    --accent:#6b97ee; --accent-ink:#0e1a30; --accent-soft:#1d2c48; --accent-line:#33507f;
    --ok:#4cc588; --ok-soft:#15301f; --busy:#e0a83f; --busy-soft:#33270f;
    --bad:#ef7f6d; --bad-soft:#3a1d17; --off:#7385998f; --off-soft:#1c2634;
    --term-bg:#0a111b; --shadow:0 10px 30px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"]{
  --bg:#0f1520; --panel:#182130; --panel2:#0c121b; --panel3:#131b28;
  --ink:#e6edf5; --sub:#96a5b8; --line:#2a3648; --line2:#3a4a60;
  --accent:#6b97ee; --accent-ink:#0e1a30; --accent-soft:#1d2c48; --accent-line:#33507f;
  --ok:#4cc588; --ok-soft:#15301f; --busy:#e0a83f; --busy-soft:#33270f;
  --bad:#ef7f6d; --bad-soft:#3a1d17; --off:#7385998f; --off-soft:#1c2634;
  --term-bg:#0a111b; --shadow:0 10px 30px rgba(0,0,0,.4);
}
html,body{height:100%}
body{
  margin:0; background:var(--bg); color:var(--ink); overflow:hidden;
  font:14px/1.55 "IBM Plex Sans KR",-apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif;
}
button{font:inherit; color:inherit; cursor:pointer}
.mono{font-family:"IBM Plex Mono",ui-monospace,Consolas,monospace}

/* ══ 두 판 — 왼쪽 대화 · 오른쪽 아티팩트 ══ */
.app{display:flex; height:100%; max-width:1440px; margin:0 auto}
.chat-col{flex:0 0 clamp(340px,42%,540px); min-width:0; display:flex; flex-direction:column; border-right:1px solid var(--line)}
.panel-col{flex:1; min-width:0; display:flex; flex-direction:column; background:var(--panel2)}

/* ── 대화 머리 ── */
.hd{display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--line); flex:none}
.hd .logo{width:30px; height:30px; border-radius:8px; background:var(--accent); color:var(--accent-ink);
  display:grid; place-items:center; font-weight:700; font-size:13px; flex:none}
.hd h1{margin:0; font-size:15px; font-weight:700; white-space:nowrap}
.hd .sub{color:var(--sub); font-size:11.5px}
.hd .mock{margin-left:auto; font-size:10.5px; color:var(--busy); background:var(--busy-soft);
  padding:2px 8px; border-radius:99px; letter-spacing:.3px; white-space:nowrap}

/* ── 대화 흐름 ── */
#chat{flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:12px; padding:16px}
.msg{display:flex; gap:9px}
.msg .who{flex:0 0 26px; width:26px; height:26px; border-radius:50%; display:grid; place-items:center;
  font-size:10.5px; font-weight:700; margin-top:2px}
.msg.ai .who{background:var(--accent-soft); color:var(--accent); border:1px solid var(--accent-line)}
.msg.me{flex-direction:row-reverse}
.msg.me .who{background:var(--off-soft); color:var(--sub); border:1px solid var(--line)}
.bub{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:9px 13px; max-width:88%; box-shadow:var(--shadow); font-size:13.5px}
.msg.me .bub{background:var(--accent); color:var(--accent-ink); border-color:transparent}
.bub .note{color:var(--sub); font-size:12px; margin-top:4px}
.thinking{display:flex; align-items:center; gap:8px; color:var(--sub)}
.spin{width:13px; height:13px; border:2px solid var(--line2); border-top-color:var(--accent); border-radius:50%; animation:sp .8s linear infinite; flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion: reduce){ .spin{animation-duration:2.4s} }

/* 의도 요약 칩 · 오른쪽 보기 링크 */
.intent{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.intent .t{font-size:11.5px; padding:2px 8px; border-radius:99px; background:var(--panel3); border:1px solid var(--line); color:var(--sub)}
.intent .t b{color:var(--ink); font-weight:500}
.seelnk{background:none; border:none; padding:0; color:var(--accent); text-decoration:underline; font-size:12px}

/* 추천 카드(대화 안 — 간단히 한 장) */
.hero{display:flex; align-items:center; gap:9px; text-align:left; width:100%; margin-top:8px;
  background:var(--accent-soft); border:1.5px solid var(--accent-line); border-radius:10px; padding:9px 11px}
.hero:hover{border-color:var(--accent)}
.hero .rec{font-size:10px; font-weight:700; letter-spacing:.5px; color:var(--accent);
  border:1px solid var(--accent-line); border-radius:4px; padding:1px 5px; flex:none}
.hero .nm{font-weight:700; font-size:13px}
.hero .meta{color:var(--sub); font-size:11.5px; margin-top:1px}
.hero .go{margin-left:auto; flex:none; color:var(--accent); font-weight:700; font-size:13px}

.actions{display:flex; gap:7px; margin-top:9px; flex-wrap:wrap}
.btn{border-radius:8px; border:1px solid var(--line2); background:var(--panel); padding:6px 14px; font-weight:500; font-size:13px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent); color:var(--accent-ink); border-color:transparent; font-weight:700}
.btn.pri:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.5; cursor:default}

/* ── 입력줄 ── */
.foot{flex:none; padding:10px 16px calc(12px + env(safe-area-inset-bottom,0px)); border-top:1px solid var(--line)}
.chips{display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px}
.chip{font-size:11.5px; border-radius:99px; border:1px solid var(--line2); background:var(--panel); color:var(--sub); padding:4px 10px}
.chip:hover{border-color:var(--accent); color:var(--accent)}
.inrow{display:flex; gap:8px}
#q{flex:1; min-width:0; font:inherit; color:var(--ink); background:var(--panel);
  border:1px solid var(--line2); border-radius:10px; padding:9px 13px}
#q:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
#send{border:none; border-radius:10px; background:var(--accent); color:var(--accent-ink); font-weight:700; padding:0 18px}

/* ══ 오른쪽 · 아티팩트 판 ══ */
.phd{flex:none; display:flex; align-items:center; gap:10px; padding:12px 20px; border-bottom:1px solid var(--line); background:var(--panel3)}
.phd .picon{width:28px; height:28px; border-radius:7px; background:var(--panel); border:1px solid var(--line);
  display:grid; place-items:center; font-size:14px; flex:none}
.phd .ptit{font-weight:700; font-size:14px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.phd .psub{color:var(--sub); font-size:11.5px}
.stage{margin-left:auto; flex:none; font-size:11px; font-weight:700; letter-spacing:.4px;
  color:var(--accent); background:var(--accent-soft); border:1px solid var(--accent-line); border-radius:99px; padding:3px 10px}
.phd .pclose{display:none; margin-left:8px; background:none; border:none; color:var(--sub); font-size:16px; flex:none}
#panel{flex:1; overflow:auto; padding:20px; min-width:0}
.pwrap{max-width:760px; margin:0 auto}

/* 빈 판 */
.pempty{height:100%; display:grid; place-items:center; color:var(--sub); text-align:center}
.pempty .big{font-size:34px; margin-bottom:10px; opacity:.5}

/* 아티팩트 속 표 */
.card{background:var(--panel); border:1px solid var(--line); border-radius:12px; overflow:hidden; box-shadow:var(--shadow)}
.card + .card{margin-top:14px}
.card .cap{padding:10px 16px; font-weight:700; font-size:13px; border-bottom:1px solid var(--line); background:var(--panel3);
  display:flex; align-items:center; gap:8px}
.cap .capsub{font-weight:400; color:var(--sub); font-size:12px}
.tblwrap{overflow-x:auto}
table{width:100%; border-collapse:collapse; font-size:13px; min-width:520px}
th{text-align:left; color:var(--sub); font-size:11px; font-weight:600; letter-spacing:.3px;
  padding:7px 14px; border-bottom:1px solid var(--line); background:var(--panel3); white-space:nowrap}
td{padding:9px 14px; border-bottom:1px solid var(--line); vertical-align:middle}
tr:last-child td{border-bottom:none}
tr.sel{cursor:pointer}
tr.sel:hover td{background:var(--accent-soft)}
tr.mute td{color:var(--sub)}
tr.picked td{background:var(--accent-soft)}
tr.picked td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
.srch{padding:10px 14px; border-bottom:1px solid var(--line)}
.srch input{width:100%; box-sizing:border-box; font:inherit; font-size:13px; color:var(--ink); background:var(--panel3);
  border:1px solid var(--line); border-radius:8px; padding:7px 11px}

/* 상태 점·알약 */
.dot{display:inline-block; width:8px; height:8px; border-radius:50%; margin-right:6px; vertical-align:1px}
.dot.ready{background:var(--ok)} .dot.busy{background:var(--busy)} .dot.down{background:var(--bad)}
.pill{font-size:11px; padding:1px 8px; border-radius:99px; white-space:nowrap}
.pill.ready{background:var(--ok-soft); color:var(--ok)}
.pill.busy{background:var(--busy-soft); color:var(--busy)}
.pill.down{background:var(--bad-soft); color:var(--bad)}
.pill.pass{background:var(--ok-soft); color:var(--ok)}
.pill.fail{background:var(--bad-soft); color:var(--bad)}
.pill.none{background:var(--off-soft); color:var(--sub)}
.pill.auto{background:var(--accent-soft); color:var(--accent)}
.pill.man{background:var(--off-soft); color:var(--sub)}

/* 스텝 표 */
.step{display:flex; align-items:center; gap:10px; padding:8px 14px; border-bottom:1px solid var(--line); background:var(--panel)}
.step:last-child{border-bottom:none}
.step .no{flex:0 0 20px; color:var(--sub); font-size:12px; text-align:right}
.kind{flex:0 0 76px; text-align:center; font-size:10.5px; font-weight:600; letter-spacing:.3px;
  border-radius:5px; padding:2px 0; background:var(--off-soft); color:var(--sub)}
.kind.snmp{background:var(--accent-soft); color:var(--accent)}
.kind.judge{background:var(--busy-soft); color:var(--busy)}
.step .desc{flex:1; min-width:0}
.step .oid{color:var(--sub); font-size:11.5px}
.step .st{flex:0 0 40px; text-align:center; font-size:13px}
.step .st .ok{color:var(--ok); font-weight:700}
.step.wait{opacity:.5}

/* 진행 막대 · 판정 */
.prog{height:6px; background:var(--off-soft); border-radius:99px; overflow:hidden; margin:2px 16px 0}
.prog i{display:block; height:100%; width:0%; background:var(--accent); border-radius:99px; transition:width .3s}
.runmeta{display:flex; gap:14px; align-items:center; padding:10px 16px; color:var(--sub); font-size:12px}
.verdict{display:flex; align-items:center; gap:10px; margin-top:14px; border-radius:12px; padding:12px 16px; font-weight:700}
.verdict.pass{background:var(--ok-soft); color:var(--ok)}
.verdict .d{font-weight:400; font-size:12px; margin-left:auto; opacity:.85}
.term{margin-top:14px; background:var(--term-bg); color:var(--term-ink); border-radius:12px;
  padding:12px 14px; font-family:"IBM Plex Mono",ui-monospace,monospace; font-size:12px; line-height:1.6;
  max-height:230px; overflow:auto}
.term .dim{color:var(--term-dim)} .term .g{color:var(--term-ok)}

/* 절차 초안 */
.gen .cap{background:var(--accent-soft)}
.gen .cap .tag{font-size:10px; font-weight:700; letter-spacing:.5px; color:var(--accent);
  border:1px solid var(--accent-line); border-radius:4px; padding:1px 5px}
.crit{display:flex; align-items:center; gap:9px; padding:11px 14px; border-top:1px solid var(--line); background:var(--panel3)}
.crit label{flex:none; font-size:12px; color:var(--busy); font-weight:700}
.crit input{flex:1; min-width:0; font:inherit; font-size:13px; color:var(--ink);
  background:var(--panel); border:1px solid var(--line2); border-radius:7px; padding:6px 10px}
.crit input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}

/* ══ 좁은 화면 — 판이 아래에서 올라오는 시트가 된다 ══ */
.pfab{display:none}
@media (max-width: 760px){
  .app{flex-direction:column}
  .chat-col{flex:1; border-right:none}
  .panel-col{position:fixed; left:0; right:0; bottom:0; top:14%; z-index:8;
    border-top:1px solid var(--line); border-radius:16px 16px 0 0; box-shadow:0 -12px 40px rgba(0,0,0,.25);
    transform:translateY(105%); transition:transform .25s}
  .panel-col.open{transform:none}
  .phd{border-radius:16px 16px 0 0}
  .phd .pclose{display:block}
  #panel{padding:16px}
  .pfab{display:flex; align-items:center; gap:7px; position:fixed; right:16px;
    bottom:calc(86px + env(safe-area-inset-bottom,0px)); z-index:7;
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:99px;
    padding:9px 16px; font-weight:700; font-size:13px; box-shadow:var(--shadow)}
  .pfab[hidden]{display:none}
}
</style>

<div class="app">
  <!-- ═══ 왼쪽 · 대화 ═══ -->
  <div class="chat-col">
    <div class="hd">
      <div class="logo">AI</div>
      <div style="min-width:0">
        <h1>Test AI 시험 콘솔</h1>
        <div class="sub">대화로 진행 · 자세한 것은 오른쪽 판에</div>
      </div>
      <span class="mock">목업 · 예시 데이터</span>
    </div>

    <div id="chat" aria-live="polite"></div>

    <div class="foot">
      <div class="chips" id="chips">
        <button class="chip" data-q="E6100 SNMP 시험 해줘">E6100 SNMP 시험 해줘</button>
        <button class="chip" data-q="E6100 LLDP 인접 장비 확인 시험 해줘">E6100 LLDP (항목 없음 → 절차 생성)</button>
        <button class="chip" data-q="E7500 Ping 시험 해줘">E7500 Ping 시험 해줘</button>
      </div>
      <div class="inrow">
        <input id="q" type="text" placeholder="예) E6100 SNMP 시험 해줘" autocomplete="off">
        <button id="send">보내기</button>
      </div>
    </div>
  </div>

  <!-- ═══ 오른쪽 · 아티팩트 판 ═══ -->
  <div class="panel-col" id="pcol">
    <div class="phd">
      <div class="picon" id="picon">▤</div>
      <div style="min-width:0">
        <div class="ptit" id="ptit">자세히 보기</div>
        <div class="psub" id="psub">대화가 진행되면 여기에 표·절차·로그가 뜹니다</div>
      </div>
      <span class="stage" id="pstage" hidden></span>
      <button class="pclose" id="pclose" aria-label="닫기">✕</button>
    </div>
    <div id="panel">
      <div class="pempty"><div><div class="big">▤</div>왼쪽에서 시험을 말로 요청하면<br>장비 표 · 시험 항목 · 실행 로그가 여기에 열립니다</div></div>
    </div>
  </div>
</div>
<button class="pfab" id="pfab">▤ 자세히 보기</button>

<script>
/* ───────────────────────── 예시 데이터 ───────────────────────── */
const DEVICES = [
  { id:'d1', name:'E6100 #2',     model:'E6100', ip:'10.1.32.12', st:'ready' },
  { id:'d2', name:'E6100 #1',     model:'E6100', ip:'10.1.32.11', st:'busy', who:'김OO · 플랜 #214' },
  { id:'d3', name:'E6100 #3',     model:'E6100', ip:'10.1.32.13', st:'down', why:'통신 안 됨' },
  { id:'d4', name:'E7500 #1',     model:'E7500', ip:'10.1.35.21', st:'ready' },
  { id:'d5', name:'E7500 #2',     model:'E7500', ip:'10.1.35.22', st:'busy', who:'박OO · 수동 점검' },
  { id:'d6', name:'E5000-POE #1', model:'E5000', ip:'10.1.31.05', st:'ready' },
];
const ST = { ready:['ready','사용 가능'], busy:['busy','사용중'], down:['down','사용 불가능'] };

const ITEMS = [
  { id:'TC-1042', name:'SNMP 기본 정보 조회 (sysDescr·sysUpTime·sysName)', cat:'관리 > SNMP', kw:['snmp'], auto:true, steps:6, last:'PASS' },
  { id:'TC-1043', name:'SNMP ifTable 인터페이스 상태 걷기',                cat:'관리 > SNMP', kw:['snmp','iftable'], auto:true, steps:14, last:'PASS' },
  { id:'TC-1044', name:'SNMP v2c Trap 수신 확인 (linkDown/linkUp)',        cat:'관리 > SNMP', kw:['snmp','trap'], auto:true, steps:11, last:'FAIL' },
  { id:'TC-0871', name:'Ping 도달성 확인 (관리 VLAN)',                      cat:'기본 > 도달성', kw:['ping','icmp'], auto:true, steps:4,  last:'PASS' },
  { id:'TC-0912', name:'OSPF 인접 관계 확립 확인',                          cat:'L3 > OSPF',   kw:['ospf'], auto:false, steps:9, last:'—' },
];

const RUN_1042 = [
  { kind:'cli',      desc:'장비 접속 · SNMP 설정 확인', cli:'show snmp community', log:['ssh admin@{ip} … 접속됨','E6100# show snmp community','community  public  (ro)'] },
  { kind:'snmp_get', desc:'sysDescr.0 조회',   oid:'1.3.6.1.2.1.1.1.0', log:['snmpget -v2c -c public {ip} sysDescr.0','SNMPv2-MIB::sysDescr.0 = "E6100 SW v2.4.1"'] },
  { kind:'snmp_get', desc:'sysUpTime.0 조회',  oid:'1.3.6.1.2.1.1.3.0', log:['snmpget … sysUpTime.0','DISMAN…::sysUpTime.0 = 41d 03:12:55'] },
  { kind:'snmp_get', desc:'sysName.0 조회',    oid:'1.3.6.1.2.1.1.5.0', log:['snmpget … sysName.0','SNMPv2-MIB::sysName.0 = "{name}"'] },
  { kind:'diff',     desc:'CLI hostname ↔ sysName 값 비교', log:['좌: "{name}"  우: "{name}"  → 같음'] },
  { kind:'judge',    desc:'판정 — sysDescr 에 "E6100" 포함 · 값 비교 일치', judge:true, log:['기준 2건 모두 충족'] },
];

const DRAFT_LLDP = {
  name: 'LLDP 인접 장비 확인',
  criteria: 'lldp neighbor 표에 인접 장비가 1대 이상 보인다',
  steps: [
    { kind:'cli',      desc:'LLDP 동작 상태 확인', cli:'show lldp',           log:['E6100# show lldp','LLDP: enabled  tx-interval 30s'] },
    { kind:'cli',      desc:'인접 장비 표 조회',   cli:'show lldp neighbor',  log:['E6100# show lldp neighbor','ge1  E7500-LAB  ge24  120s'] },
    { kind:'snmp_get', desc:'lldpStatsRemTablesInserts 조회', oid:'1.0.8802.1.1.2.1.2.2.0', log:['snmpget … lldpStatsRemTablesInserts.0 = 1'] },
    { kind:'wait',     desc:'재광고 주기 대기 (30초)', log:['wait 30s … (목업이라 바로 지나감)'] },
    { kind:'cli',      desc:'인접 표 재조회 · 유지 확인', cli:'show lldp neighbor', log:['ge1  E7500-LAB  ge24  120s  → 유지됨'] },
    { kind:'judge',    desc:'판정 — 합격 기준 확인', judge:true, log:['neighbor 1건 ≥ 1  → 충족'] },
  ],
};

/* ───────────────────────── 공용 ───────────────────────── */
const chat = document.getElementById('chat');
const q = document.getElementById('q');
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const scrollChat = () => requestAnimationFrame(() => { chat.scrollTop = chat.scrollHeight; });
const after = (ms, fn) => setTimeout(fn, ms);

function bubble(role, html){
  const m = document.createElement('div');
  m.className = 'msg ' + role;
  m.innerHTML = `<div class="who">${role==='ai'?'AI':'나'}</div><div class="bub">${html}</div>`;
  chat.appendChild(m); scrollChat();
  return m.querySelector('.bub');
}
const meSay = t => bubble('me', esc(t));
const aiSay = h => bubble('ai', h);
function aiThink(text){
  const b = bubble('ai', `<div class="thinking"><span class="spin"></span>${esc(text)}</div>`);
  return { replace(html){ b.innerHTML = html; scrollChat(); return b; } };
}

/* ── 오른쪽 판 다루기 ── */
const panel = document.getElementById('panel');
const pcol = document.getElementById('pcol');
const pfab = document.getElementById('pfab');
let panelHas = false;
function setPanel(icon, title, sub, stage, node){
  document.getElementById('picon').textContent = icon;
  document.getElementById('ptit').textContent = title;
  document.getElementById('psub').textContent = sub;
  const sg = document.getElementById('pstage');
  if (stage){ sg.textContent = stage; sg.hidden = false; } else sg.hidden = true;
  panel.replaceChildren();
  const wrap = document.createElement('div');
  wrap.className = 'pwrap';
  wrap.appendChild(node);
  panel.appendChild(wrap);
  panel.scrollTop = 0;
  panelHas = true;
  openPanel();
}
function openPanel(){ pcol.classList.add('open'); pfab.hidden = true; }
document.getElementById('pclose').onclick = () => { pcol.classList.remove('open'); pfab.hidden = false; };
pfab.onclick = openPanel;

function el(html){ const d = document.createElement('div'); d.innerHTML = html; return d.firstElementChild; }

/* ───────────────────────── 흐름 ───────────────────────── */
let flow = null;   // { model, kw, items, device, item }

function parse(text){
  const low = text.toLowerCase();
  const m = low.match(/e\s*-?\s*(5000|6100|7500)/);
  const KWS = ['snmp','trap','iftable','ping','icmp','ospf','lldp','vlan','stp','qos','poe'];
  return { model: m ? 'E' + m[1] : null, kw: KWS.filter(k => low.includes(k)) };
}

function start(text){
  meSay(text);
  q.value = '';
  const { model, kw } = parse(text);
  if (!kw.length){
    aiSay(`무슨 시험인지 못 알아들었습니다. <b>SNMP·Ping·OSPF·LLDP</b> 같은 말을 넣어 주세요.
      <div class="note">예) "E6100 SNMP 시험 해줘"</div>`);
    return;
  }
  flow = { model, kw, items: [], device: null, item: null };

  const t = aiThink('시험 항목을 찾는 중…');
  after(900, () => {
    flow.items = ITEMS
      .map(it => ({ it, sc: it.kw.filter(k => kw.includes(k)).length }))
      .filter(x => x.sc > 0).sort((a,b) => b.sc - a.sc).map(x => x.it);

    t.replace(`요청을 이렇게 읽었습니다.
      <div class="intent">
        <span class="t">모델 <b>${flow.model ?? '미지정'}</b></span>
        <span class="t">키워드 <b>${kw.map(k=>k.toUpperCase()).join(' · ')}</b></span>
        <span class="t">항목 <b>${flow.items.length ? flow.items.length + '건 찾음' : '없음 → 절차 생성'}</b></span>
      </div>
      <div class="note">${flow.items.length
        ? '등록된 항목 ' + flow.items.length + '건이 맞아 보입니다 — 먼저 장비부터 정하겠습니다.'
        : '맞는 항목이 없어 <b>절차를 새로 지어</b> 돌립니다 — 그래도 장비는 먼저 필요합니다.'}</div>`);
    after(500, askDevice);
  });
}

/* ── 1단계 · 장비 — 대화에는 추천 한 장, 오른쪽에 전체 표 ── */
function askDevice(){
  const t = aiThink('장비 점유 상태를 읽는 중…');
  after(800, () => {
    const pool = flow.model ? DEVICES.filter(d => d.model === flow.model) : DEVICES;
    const hero = pool.find(d => d.st === 'ready');

    panelDevices(pool);

    const b = t.replace(`${esc(flow.model ?? '장비')} ${pool.length}대가 있습니다${hero ? ' — 비어 있는 이것으로 할까요?' : ' — 지금 비어 있는 것이 없습니다.'}
      <div class="note">전체 상태는 <button class="seelnk js-see">오른쪽 판</button>에서 — 표의 줄을 눌러 골라도 됩니다.</div>`);
    b.querySelector('.js-see').onclick = openPanel;
    if (hero){
      const h = el(`<button class="hero"><span class="rec">추천</span>
        <span><span class="nm">${esc(hero.name)}</span>
        <div class="meta"><span class="mono">${hero.ip}</span> · 사용 가능</div></span><span class="go">선택 →</span></button>`);
      h.onclick = () => pickDevice(hero);
      b.appendChild(h);
    }
    scrollChat();
  });
}

function panelDevices(pool){
  const rows = DEVICES.map(d => {
    const usable = d.st === 'ready';
    const dim = flow.model && d.model !== flow.model;
    return `<tr class="${usable ? 'sel' : 'mute'}" data-id="${d.id}" ${dim?'style="opacity:.55"':''}>
      <td><span class="dot ${d.st}"></span><b>${esc(d.name)}</b></td><td>${d.model}</td>
      <td class="mono" style="font-size:12px">${d.ip}</td>
      <td><span class="pill ${ST[d.st][0]}">${ST[d.st][1]}</span></td>
      <td style="color:var(--sub);font-size:12px">${esc(d.who ?? d.why ?? '')}</td></tr>`;
  }).join('');
  const node = el(`<div class="card">
      <div class="cap">장비 현황 <span class="capsub">· ${flow.model ?? '전체'} ${pool.length}대 — 줄을 누르면 그 장비로 정해집니다</span></div>
      <div class="tblwrap"><table>
        <thead><tr><th>장비</th><th>모델</th><th>IP</th><th>상태</th><th>비고</th></tr></thead>
        <tbody>${rows}</tbody></table></div>
    </div>`);
  node.querySelectorAll('tr.sel').forEach(tr => tr.onclick = () => pickDevice(DEVICES.find(d => d.id === tr.dataset.id)));
  setPanel('🖧','장비 고르기','점유·통신 상태를 함께 본다','1단계 · 장비', node);
}

function pickDevice(d){
  flow.device = d;
  meSay(`${d.name} (${d.ip}) 로 할게`);
  after(400, () => flow.items.length ? askItem() : offerDraft());
}

/* ── 2단계 · 항목 — 대화에는 추천 한 장, 오른쪽에 검색 표 ── */
function askItem(){
  const t = aiThink('말과 가까운 항목을 고르는 중…');
  after(800, () => {
    const hero = flow.items[0];
    panelItems();
    const b = t.replace(`이 항목이 가장 가깝습니다 — 이걸로 할까요?
      <div class="note">다른 후보 ${ITEMS.length - 1}건은 <button class="seelnk js-see">오른쪽 판</button>에서 검색해 고를 수 있습니다.</div>`);
    b.querySelector('.js-see').onclick = openPanel;
    const h = el(`<button class="hero"><span class="rec">추천</span>
      <span><span class="nm">${esc(hero.name)}</span>
      <div class="meta"><span class="mono">${hero.id}</span> · ${hero.auto?'자동':'수동'} · ${hero.steps}스텝 · 지난 결과 ${hero.last}</div></span>
      <span class="go">선택 →</span></button>`);
    h.onclick = () => pickItem(hero);
    b.appendChild(h);
    scrollChat();
  });
}

function panelItems(){
  const matched = new Set(flow.items.map(it => it.id));
  const draw = f => ITEMS
    .filter(it => !f || (it.name + it.cat + it.id).toLowerCase().includes(f))
    .sort((a,b) => (matched.has(b.id)?1:0) - (matched.has(a.id)?1:0))
    .map(it => `<tr class="sel" data-id="${it.id}">
      <td class="mono" style="font-size:12px">${it.id}</td>
      <td><b>${esc(it.name)}</b>${matched.has(it.id)?' <span class="pill auto">말과 맞음</span>':''}</td>
      <td style="white-space:nowrap">${esc(it.cat)}</td>
      <td><span class="pill ${it.auto?'auto':'man'}">${it.auto?'자동':'수동'}</span></td>
      <td>${it.steps}</td>
      <td><span class="pill ${it.last==='PASS'?'pass':it.last==='FAIL'?'fail':'none'}">${it.last}</span></td></tr>`).join('')
    || `<tr><td colspan="6" style="color:var(--sub)">맞는 항목이 없습니다.</td></tr>`;
  const node = el(`<div class="card">
      <div class="cap">시험 항목 <span class="capsub">· 등록 ${ITEMS.length}건 — 줄을 누르면 그 항목으로 정해집니다</span></div>
      <div class="srch"><input type="text" id="item-srch" placeholder="이름·분류·번호로 찾기"></div>
      <div class="tblwrap"><table>
        <thead><tr><th>번호</th><th>항목</th><th>분류</th><th>방식</th><th>스텝</th><th>지난 결과</th></tr></thead>
        <tbody>${draw('')}</tbody></table></div>
    </div>`);
  const tbody = node.querySelector('tbody');
  const bind = () => node.querySelectorAll('tr.sel').forEach(tr => tr.onclick = () => pickItem(ITEMS.find(x => x.id === tr.dataset.id)));
  bind();
  node.querySelector('input').oninput = e => { tbody.innerHTML = draw(e.target.value.trim().toLowerCase()); bind(); };
  setPanel('☰','시험 항목 고르기', flow.device ? flow.device.name + ' 에서 돌릴 항목' : '', '2단계 · 항목', node);
}

function pickItem(it){
  flow.item = it;
  meSay(`"${it.name}" 으로`);
  after(400, confirmRun);
}

/* ── 3단계 · 실행 확인 → 실행(자세한 것은 오른쪽) ── */
function confirmRun(){
  const it = flow.item, d = flow.device;
  panelPlan(RUN_1042, it.name, `${d.name} · ${d.ip} — community=public · v2c · 161`);
  const b = aiSay(`<b>${esc(d.name)}</b> 에서 <b>${esc(it.name)}</b> 을 실행합니다.
    <div class="note">절차 ${RUN_1042.length}스텝은 <button class="seelnk js-see">오른쪽 판</button>에서 확인하세요.</div>
    <div class="actions"><button class="btn pri">▶ 실행</button><button class="btn">그만두기</button></div>`);
  b.querySelector('.js-see').onclick = openPanel;
  const [run, cancel] = b.querySelectorAll('.btn');
  run.onclick = () => { run.disabled = cancel.disabled = true; execute(RUN_1042, it.name); };
  cancel.onclick = () => { run.disabled = cancel.disabled = true; aiSay('알겠습니다 — 실행하지 않았습니다. 다시 물어보면 이어서 합니다.'); };
}

function stepRow(s, i, wait){
  const kindCls = s.kind.startsWith('snmp') ? 'snmp' : s.judge ? 'judge' : '';
  const kindLbl = s.judge ? '판정' : s.kind === 'cli' ? 'CLI' : s.kind === 'wait' ? 'WAIT' : s.kind === 'diff' ? 'DIFF' : s.kind.toUpperCase();
  return el(`<div class="step${wait ? ' wait' : ''}"><span class="no">${i+1}</span><span class="kind ${kindCls}">${kindLbl}</span>
    <span class="desc">${esc(s.desc)}${s.oid ? ` <span class="oid mono">${s.oid}</span>` : ''}${s.cli ? ` <span class="oid mono">${esc(s.cli)}</span>` : ''}</span>
    <span class="st"></span></div>`);
}

function panelPlan(steps, title, sub){
  const node = el(`<div class="card"><div class="cap">실행 절차 <span class="capsub">· ${steps.length}스텝</span></div><div class="steplist"></div></div>`);
  const list = node.querySelector('.steplist');
  steps.forEach((s,i) => list.appendChild(stepRow(s, i, false)));
  setPanel('▶', title, sub, '3단계 · 실행 확인', node);
}

/* 실행 — 왼쪽엔 짧은 진행 말, 오른쪽에 스텝·로그·판정 전부 */
function execute(steps, title){
  const d = flow.device;
  const node = el(`<div>
      <div class="card">
        <div class="cap">진행 <span class="capsub js-pct">0 / ${steps.length}</span></div>
        <div class="prog" style="margin:12px 16px 0"><i></i></div>
        <div class="runmeta"><span>장비 <b>${esc(d.name)}</b></span><span class="mono">${d.ip}</span><span class="js-clk">0.0s</span></div>
        <div class="steplist" style="border-top:1px solid var(--line)"></div>
      </div>
      <div class="term"><div class="dim"># ${new Date().toLocaleTimeString('ko-KR')} 실행 시작 — ${d.ip}</div></div>
    </div>`);
  const list = node.querySelector('.steplist');
  const rows = steps.map((s,i) => { const r = stepRow(s, i, true); list.appendChild(r); return r; });
  const term = node.querySelector('.term');
  const bar = node.querySelector('.prog i');
  setPanel('⚡', title + ' — 실행 중', `${d.name} · ${d.ip}`, '3단계 · 실행', node);

  const prog = aiThink(`실행 중 — 0/${steps.length} 스텝…`);
  const t0 = Date.now();
  const clk = setInterval(() => { node.querySelector('.js-clk').textContent = ((Date.now()-t0)/1000).toFixed(1) + 's'; }, 200);

  let i = 0;
  (function next(){
    if (i >= steps.length){
      clearInterval(clk);
      const dur = ((Date.now()-t0)/1000).toFixed(1);
      node.appendChild(el(`<div class="verdict pass">✓ PASS <span style="font-weight:400">— ${steps.length}/${steps.length} 스텝 통과</span>
        <span class="d">${dur}s · 결과는 사이클에 적혔습니다 (목업)</span></div>`));
      document.getElementById('ptit').textContent = title + ' — 완료';
      document.getElementById('pstage').textContent = '결과';
      prog.replace(`끝났습니다 — <b style="color:var(--ok)">PASS</b> (${steps.length}/${steps.length} 스텝 · ${dur}s)
        <div class="note">스텝별 로그·판정은 오른쪽 판에 남아 있습니다. 같은 장비로 다른 시험을 이어서 하거나 새로 물어보세요.</div>`);
      return;
    }
    const s = steps[i], r = rows[i];
    r.classList.remove('wait');
    r.querySelector('.st').innerHTML = '<span class="spin" style="display:inline-block"></span>';
    prog.replace(`<div class="thinking"><span class="spin"></span>실행 중 — ${i+1}/${steps.length} · ${esc(s.desc)}</div>`);
    after(500 + Math.random()*450, () => {
      r.querySelector('.st').innerHTML = '<span class="ok">✓</span>';
      bar.style.width = Math.round(((i+1)/steps.length)*100) + '%';
      node.querySelector('.js-pct').textContent = `${i+1} / ${steps.length}`;
      (s.log||[]).forEach(l => {
        const txt = l.replaceAll('{ip}', d.ip).replaceAll('{name}', d.name.replace(/\s/g,'-'));
        const line = document.createElement('div');
        line.innerHTML = (s.judge ? '<span class="g">' : (txt.startsWith('snmpget')||txt.startsWith('ssh')) ? '<span class="dim">$ ' : '<span>') + esc(txt) + '</span>';
        term.appendChild(line);
      });
      term.scrollTop = term.scrollHeight;
      i++; next();
    });
  })();
}

/* ── 갈래 ② · 항목이 없다 → 절차 생성 ── */
function offerDraft(){
  const b = aiSay(`등록된 항목 중에 맞는 것이 없습니다 (키워드 ${flow.kw.map(k=>k.toUpperCase()).join(' · ')} — 0건).
    <div class="actions"><button class="btn pri">✳ 절차 새로 생성</button><button class="btn">전체 목록 보기</button></div>`);
  const [gen, all] = b.querySelectorAll('.btn');
  gen.onclick = () => { gen.disabled = all.disabled = true; makeDraft(); };
  all.onclick = () => { flow.items = []; panelItems(); };
}

function makeDraft(){
  const t = aiThink('절차를 짓는 중 — MIB·명령 사전을 뒤지고 있습니다…');
  after(1400, () => {
    const d = DRAFT_LLDP;
    const node = el(`<div class="card gen">
        <div class="cap"><span class="tag">생성됨</span>${esc(d.name)} <span class="capsub">· ${d.steps.length}스텝 · ${esc(flow.device.name)}</span></div>
        <div class="steplist"></div>
        <div class="crit"><label for="crit-in">합격 기준</label><input id="crit-in" value="${esc(d.criteria)}"></div>
      </div>`);
    const list = node.querySelector('.steplist');
    d.steps.forEach((s,i) => list.appendChild(stepRow(s, i, false)));
    setPanel('✳','절차 초안 — ' + d.name, '합격 기준을 확정해야 저장됩니다', '절차 생성', node);

    const b = t.replace(`절차 초안 ${d.steps.length}스텝을 지었습니다 — <button class="seelnk js-see">오른쪽 판</button>에서 검토하세요.
      <div class="note"><b>합격 기준</b>은 판 아래 입력칸에서 고칠 수 있고, 사람이 확정해야 저장됩니다.</div>
      <div class="actions"><button class="btn pri">저장하고 실행</button><button class="btn">항목으로 저장만</button></div>`);
    b.querySelector('.js-see').onclick = openPanel;
    const [go, saveOnly] = b.querySelectorAll('.actions .btn');
    const grabCrit = () => { d.criteria = (node.querySelector('#crit-in').value || '').trim() || d.criteria; };
    go.onclick = () => {
      grabCrit(); go.disabled = saveOnly.disabled = true;
      meSay('저장하고 바로 실행해');
      aiSay(`<b>TC-1101 · ${esc(d.name)}</b> 으로 저장했습니다 (관리 > LLDP · 자동).
        <div class="note">합격 기준 — ${esc(d.criteria)}</div>`);
      after(600, () => execute(d.steps, d.name));
    };
    saveOnly.onclick = () => {
      grabCrit(); go.disabled = saveOnly.disabled = true;
      meSay('일단 항목으로만 저장해');
      aiSay(`<b>TC-1101 · ${esc(d.name)}</b> 으로 저장했습니다. 시험 목록에서 언제든 돌릴 수 있습니다.`);
    };
  });
}

/* ───────────────────────── 입력 ───────────────────────── */
document.getElementById('send').onclick = () => { if (q.value.trim()) start(q.value.trim()); };
q.addEventListener('keydown', e => { if (e.key === 'Enter' && q.value.trim()) start(q.value.trim()); });
document.getElementById('chips').addEventListener('click', e => {
  const c = e.target.closest('.chip');
  if (c) start(c.dataset.q);
});
